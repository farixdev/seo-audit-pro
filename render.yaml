# SEO Audit Pro team server on Render (Blueprint).
# Render dashboard > New > Blueprint > pick this repository. It asks for the
# values marked "sync: false"; everything else is set here.
#
# Free plan: the service sleeps after 15 minutes without use (the next request
# wakes it in about a minute), has about a tenth of a CPU (so audits run one at
# a time and slower), and has no disk (files on it vanish on every restart).
# Everything that matters lives in the Neon database: leads, audit results,
# people, chat, settings and uploaded files; report files are re-created
# from the stored results when someone opens them.
#
# To upgrade later: set "plan: starter", raise MAX_CONCURRENT_AUDITS to 2.
services:
  - type: web
    name: mindcob-seo-audit-pro
    runtime: python
    region: ohio            # next to the Neon database (AWS us-east-2)
    plan: free
    buildCommand: pip install -r requirements.txt
    # One process only: the live-event hub, audit queue and email worker are in-process.
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT --workers 1 --threads 32 --timeout 180
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SEO_ENV
        value: production
      - key: SEO_DATA_DIR
        value: /tmp/seo-audit-pro   # temporary on the free plan; nothing permanent is kept here
      - key: MAX_CONCURRENT_AUDITS
        value: "1"
      # The Neon connection string (Neon console > Connection details).
      - key: DATABASE_URL
        sync: false
      # Created once and kept; changing DATA_ENCRYPTION_KEY makes saved email passwords unreadable.
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      # First Manager account, created on the first start when no account exists.
      # The password is temporary: the app asks to change it at the first sign-in.
      - key: BOOTSTRAP_MANAGER_EMAIL
        sync: false
      - key: BOOTSTRAP_MANAGER_PASSWORD
        sync: false
      - key: BOOTSTRAP_MANAGER_NAME
        sync: false
      # Optional: Google PageSpeed key (can also be saved later in the app's Settings).
      - key: PAGESPEED_API_KEY
        sync: false
