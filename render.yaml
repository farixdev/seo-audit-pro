# SEO Audit Pro team server on Render (Blueprint).
# Render dashboard > New > Blueprint > pick this repository. It asks for the
# values marked "sync: false"; everything else is set here.
#
# The server only connects the team: it signs people in, stores and shares the
# data in the Neon database, relays chat and sends email. All heavy work runs
# on each person's own computer in the desktop app: audits, Word/PDF reports and
# reading lead files. So the free plan is enough:
# * it sleeps after 15 minutes without requests (the app waits up to 90 seconds
#   while it wakes); an uptime monitor on /api/ping keeps it awake without
#   waking the database;
# * it has no disk, so files on it vanish on every restart: nothing permanent is
#   kept there (uploaded files and report files are in the database too).
services:
  - type: web
    name: mindcob-seo-audit-pro
    runtime: python
    region: ohio            # next to the Neon database (AWS us-east-2)
    plan: free
    buildCommand: pip install -r requirements.txt
    # One process only: the live-event hub and the email queue are in-process.
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT --workers 1 --threads 32 --timeout 180
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SEO_ENV
        value: production
      - key: SEO_DATA_DIR
        value: /tmp/seo-audit-pro   # temporary on the free plan; nothing permanent is kept here
      - key: AUDITS_RUN_ON
        value: app                  # audits and report files are made on each person's computer
      - key: MAX_CONCURRENT_AUDITS
        value: "2"                  # audits at a time on each computer (Managers can change it in Settings)
      # The Neon connection string (Neon console > Connection details).
      - key: DATABASE_URL
        sync: false
      # Created once and kept; changing DATA_ENCRYPTION_KEY makes saved email passwords unreadable.
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      # First Manager account, created on the first start when no account exists.
      # The password is temporary: the app asks to change it at the first sign-in.
      - key: BOOTSTRAP_MANAGER_EMAIL
        sync: false
      - key: BOOTSTRAP_MANAGER_PASSWORD
        sync: false
      - key: BOOTSTRAP_MANAGER_NAME
        sync: false
      # Optional: Google PageSpeed key (can also be saved later in the app's Settings).
      - key: PAGESPEED_API_KEY
        sync: false
